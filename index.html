<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Hangman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* slate-900 fallback */
        overflow-x: hidden; /* Prevent horizontal scroll from waves */
      }

      /* Wave Animations */
      @keyframes move-wave {
        0% { transform: translateX(0) translateZ(0) scaleY(1); }
        50% { transform: translateX(-25%) translateZ(0) scaleY(0.55); }
        100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
      }

      .wave-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 50vh; /* Cover bottom half */
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .wave {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 200%;
        height: 100%;
        background-repeat: repeat-x;
        background-position: bottom;
        background-size: 50% 100%;
        transform-origin: center bottom;
      }

      .wave-1 {
        opacity: 0.3;
        z-index: 1;
        animation: move-wave 25s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite;
        fill: #22d3ee; /* cyan-400 */
      }

      .wave-2 {
        opacity: 0.2;
        z-index: 2;
        animation: move-wave 15s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite reverse;
        fill: #0891b2; /* cyan-600 */
      }

      .wave-3 {
        opacity: 0.1;
        z-index: 3;
        animation: move-wave 30s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite;
        fill: #475569; /* slate-600 */
      }
      
      /* Utility for glass effects ensuring readability */
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col relative">
    <div id="root" class="flex-grow flex flex-col relative z-10"></div>
    
    <!-- Wave Container Component injected via App.tsx usually, but we can put pure CSS/SVG background here or in App.tsx. 
         We will put it in App.tsx to keep it React-managed or clear. 
         Actually, putting the SVG definition in App.tsx is better for cleanliness. -->
  </body>
</html>
